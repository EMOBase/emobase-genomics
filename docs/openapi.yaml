  /uploads:
    post:
      summary: Create a TUS upload
      description: |
        Initiates a resumable file upload using the [TUS protocol v1.0.0](https://tus.io/protocols/resumable-upload).

        **Upload-Metadata fields** (each value is base64-encoded):

        | Key | Required | Description |
        |---|---|---|
        | `fileType` | Yes | One of the accepted file types (see enum below). |
        | `fileName` | Yes | File name; must end with `.gz` or `.gzip`. |
        | `version` | Yes | Version name. Required for all file types. |
        | `assembly` | Conditional | The target Assembly Version's **`id`** as a decimal integer (e.g. `6`; see `GET /versions/{name}/assemblies`). Not the species code: a species code does not identify an assembly. **Required for every `fileType` except `orthology.tsv`**, which is shared across all species in the Version and takes no `assembly`. The Assembly Version must already exist in `version`. |
        | `order` | Conditional | Required when `fileType` is `orthology.tsv`. |
        | `algorithm` | Conditional | Required when `fileType` is `orthology.tsv`. |
        | `geneIDKey` | Conditional | Required when `fileType` is `genomic.gff`. GFF3 attribute key used to extract the gene ID. Supports simple keys (e.g. `ID`) and nested dot-notation keys (e.g. `Dbxref.GeneID`) to look up a `dbname:dbvalue` entry inside the attribute. |
        | `trimPrefixChars` | Conditional | Required when `fileType` is `genomic.gff`. Integer — number of characters to strip from the start of the extracted gene ID value. Use `0` for no trimming. |
        | `trimSuffixChars` | Conditional | Required when `fileType` is `genomic.gff`. Integer — number of characters to strip from the end of the extracted gene ID value. Use `0` for no trimming. |
        | `oldGeneIDKeys` | No | Comma-separated list of additional GFF3 attribute keys (same format as `geneIDKey`) whose extracted values are stored as previous/synonym gene IDs. Only used when `fileType` is `genomic.gff`. |
        | `species` | Conditional | Required when `fileType` is `species.synonym`. The species identifier whose synonym rows are parsed from the file (e.g. `Dmel`). Independent of `assembly`, which says which Assembly Version the file is filed under. |
        | `trackName` | Conditional | Required when `fileType` is `jbrowse.track`. Human-readable display name for the JBrowse2 track. |
        | `category` | No | Only used when `fileType` is `jbrowse.track`. Comma-separated list of category labels used to group the track in the JBrowse2 track selector (e.g. `Alignments,My Lab`). |
        | `selectInDefaultSession` | No | Only used when `fileType` is `jbrowse.track`. Boolean (`true`/`false`, default `false`). When `true`, the track is added to the assembly's default session (already selected/visible the first time a user opens that assembly in JBrowse2). |

        **Accepted `fileType` values:**
        - `genomic.fna`
        - `genomic.gff`
        - `rna.fna`
        - `cds.fna`
        - `protein.faa`
        - `orthology.tsv` *(shared across the whole Version; takes no `assembly`; 1 active per version)*
        - `species.synonym` *(requires `species` metadata; accepts `fb_synonym_*.tsv.gz` and `fbgn_fbtr_fbpp_*.tsv.gz` files)*
        - `dsrna.csv` *(only for an assembly whose `species` is `Tcas`; 1 active per assembly — re-upload replaces that assembly's previous index)*
        - `jbrowse.track` *(multiple tracks allowed per assembly; requires `trackName` metadata; optional `category`; deletable)*
        - `orthology.bundle` *(many `orthology.tsv` files in one upload; version-scoped, takes no `assembly`; see below)*
        - `jbrowse.track.bundle` *(many `jbrowse.track` files of one assembly in one upload; requires `assembly`; see below)*

        **Bundle uploads** (`orthology.bundle`, `jbrowse.track.bundle`):

        - The file must be a `.tar.gz` archive. Metadata is `fileType`, `fileName` and `version`, plus `assembly` for `jbrowse.track.bundle` only. Do not send `assembly` for `orthology.bundle`: orthology belongs to the whole version.
        - `jbrowse.track.bundle` covers exactly one assembly. An unknown `assembly` is rejected at upload with 400, and no archive is stored. Its tracks are stored under that assembly's folder.
        - The archive holds the data files plus a `manifest.csv`, all at the archive root (no folders, links or macOS `._*` files). Build it with e.g. `COPYFILE_DISABLE=1 tar czf bundle.tar.gz -C <folder> .`
        - Data files may be plain or already gzipped; plain files are gzipped on the server.
        - `manifest.csv` has one row per data file and exactly the template's columns (any order). Download the template from `GET /upload-files/templates/{fileType}`. Each row's metadata follows the same rules as a single upload of the child type. In `jbrowse.track.bundle`, `trackName` must be unique within the bundle.
        - The upload enqueues one `ORTHOLOGY.BUNDLE` / `JBROWSE.TRACK.BUNDLE` job. It validates everything first: if any file or row is invalid, the job fails listing every problem and nothing is created.
        - On success, each data file becomes an independent upload file (listed, processed and deletable exactly like a single upload). The bundle itself is not listed in `GET /upload-files`.

        On success, the `Location` response header contains the URL for subsequent PATCH / HEAD requests.
      operationId: createUpload
      tags: [Uploads]
      parameters:
        - name: Tus-Resumable
          in: header
          required: true
          schema:
            type: string
            enum: ['1.0.0']
        - name: Upload-Length
          in: header
          required: true
          schema:
            type: integer
          description: Total size of the upload in bytes.
        - name: Upload-Metadata
          in: header
          required: true
          schema:
            type: string
          description: |
            Comma-separated `key base64(value)` pairs.
            Example: `fileType Z2Vub21pYy5nZmY=,fileName ZG1lbC5nZmYuZ3o=,version ZG1lbF9yNi41NA==,assembly RG1lbA==`
      responses:
        '201':
          description: Upload created.
          headers:
            Location:
              schema:
                type: string
              description: URL of the created upload resource.
            Tus-Resumable:
              schema:
                type: string
                enum: ['1.0.0']
        '400':
          description: Invalid metadata (unknown fileType, invalid fileName, missing required fields, non-gzip extension, missing or unknown `assembly`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidFileType:
                  summary: unknown fileType
                  value:
                    error: 'invalid fileType "genomic.xyz", must be one of: genomic.fna, genomic.gff, ...'
                    requestId: 7f3e2a1b-4c5d-6e7f-8a9b-0c1d2e3f4a5b
                invalidExtension:
                  summary: file is not gzip
                  value:
                    error: only gzip files are accepted (.gz or .gzip)
                    requestId: 7f3e2a1b-4c5d-6e7f-8a9b-0c1d2e3f4a5b
                versionNotFound:
                  summary: version does not exist
                  value:
                    error: 'version "dmel_r6.99" not found'
                    requestId: 7f3e2a1b-4c5d-6e7f-8a9b-0c1d2e3f4a5b
                missingAssembly:
                  summary: assembly missing for a non-orthology file type
                  value:
                    error: '"genomic.gff" uploads require an "assembly" metadata field'
                    requestId: 7f3e2a1b-4c5d-6e7f-8a9b-0c1d2e3f4a5b
                assemblyNotAnID:
                  summary: assembly given as a species code instead of an id
                  value:
                    error: '"assembly" metadata must be an assembly id, got "Hsap"'
                    requestId: 7f3e2a1b-4c5d-6e7f-8a9b-0c1d2e3f4a5b
                assemblyNotFound:
                  summary: no Assembly Version with this id in the Version
                  value:
                    error: 'assembly "999" not found in version "dmel_r6.99"'
                    requestId: 7f3e2a1b-4c5d-6e7f-8a9b-0c1d2e3f4a5b
                missingGeneIDKey:
                  summary: geneIDKey missing for genomic.gff
                  value:
                    error: 'genomic.gff uploads require a "geneIDKey" metadata field'
                    requestId: 7f3e2a1b-4c5d-6e7f-8a9b-0c1d2e3f4a5b
                invalidTrimPrefixChars:
                  summary: trimPrefixChars is not an integer
                  value:
                    error: 'genomic.gff "trimPrefixChars" metadata field must be an integer'
                    requestId: 7f3e2a1b-4c5d-6e7f-8a9b-0c1d2e3f4a5b
                invalidTrimSuffixChars:
                  summary: trimSuffixChars is not an integer
                  value:
                    error: 'genomic.gff "trimSuffixChars" metadata field must be an integer'
                    requestId: 7f3e2a1b-4c5d-6e7f-8a9b-0c1d2e3f4a5b
                missingTrackName:
                  summary: trackName missing for jbrowse.track
                  value:
                    error: 'jbrowse.track uploads require a "trackName" metadata field'
                    requestId: 7f3e2a1b-4c5d-6e7f-8a9b-0c1d2e3f4a5b
                dsrnaNotSupported:
                  summary: dsrna.csv upload attempted on an assembly whose species is not Tcas
                  value:
                    error: 'dsrna.csv uploads are only supported for the "Tcas" species'
                    requestId: 7f3e2a1b-4c5d-6e7f-8a9b-0c1d2e3f4a5b
        '403':
          description: Missing or invalid token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                forbidden:
                  value:
                    error: permission denied
                    requestId: 7f3e2a1b-4c5d-6e7f-8a9b-0c1d2e3f4a5b
        '409':
          description: A job for this file type is already pending or running for the target assembly (or, for `orthology.tsv`, for the given version). `jbrowse.track` is exempt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                conflict:
                  value:
                    error: a job for file type "genomic.gff" is already pending or running for this version
                    requestId: 7f3e2a1b-4c5d-6e7f-8a9b-0c1d2e3f4a5b

  /uploads/{id}:
    head:
      summary: Query upload offset (TUS)
      description: Returns the current byte offset of a resumable upload.
      operationId: getUploadOffset
      tags: [Uploads]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Upload ID returned in the `Location` header of the create response.
        - name: Tus-Resumable
          in: header
          required: true
          schema:
            type: string
            enum: ['1.0.0']
      responses:
        '200':
          description: Current offset.
          headers:
            Upload-Offset:
              schema:
                type: integer
              description: Number of bytes already uploaded.
            Upload-Length:
              schema:
                type: integer
              description: Total upload size in bytes.
            Tus-Resumable:
              schema:
                type: string
                enum: ['1.0.0']
        '403':
          description: Missing or invalid token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                forbidden:
                  value:
                    error: permission denied
                    requestId: 7f3e2a1b-4c5d-6e7f-8a9b-0c1d2e3f4a5b
        '404':
          description: Upload not found.

    patch:
      summary: Upload a chunk (TUS)
      description: |
        Appends bytes to an in-progress upload. When the final chunk is received and the file is valid,
        the server enqueues background processing jobs and returns them in the `X-Jobs` response header
        as a JSON array of `JobSummary` objects.
      operationId: uploadChunk
      tags: [Uploads]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: Tus-Resumable
          in: header
          required: true
          schema:
            type: string
            enum: ['1.0.0']
        - name: Upload-Offset
          in: header
          required: true
          schema:
            type: integer
          description: Byte offset at which this chunk begins.
        - name: Content-Type
          in: header
          required: true
          schema:
            type: string
            enum: [application/offset+octet-stream]
      requestBody:
        required: true
        content:
          application/offset+octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '204':
          description: Chunk accepted. On the final chunk, `X-Jobs` and `X-Job-IDs` are included with the enqueued processing jobs.
          headers:
            Upload-Offset:
              schema:
                type: integer
              description: New byte offset after this chunk.
            Tus-Resumable:
              schema:
                type: string
                enum: ['1.0.0']
            X-Jobs:
              schema:
                type: string
              description: |
                JSON array of `JobSummary` objects for all enqueued processing jobs.
                Present only on the final chunk of versioned file uploads.
            X-Job-IDs:
              deprecated: true
              schema:
                type: string
              description: |
                Deprecated. Comma-separated list of enqueued job IDs. Use `X-Jobs` instead.
                Present only on the final chunk of versioned file uploads.
        '403':
          description: Missing or invalid token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                forbidden:
                  value:
                    error: permission denied
                    requestId: 7f3e2a1b-4c5d-6e7f-8a9b-0c1d2e3f4a5b
        '404':
          description: Upload not found.
        '422':
          description: Uploaded file is not a valid gzip archive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                notGzip:
                  value:
                    error: uploaded file is not a valid gzip
                    requestId: 7f3e2a1b-4c5d-6e7f-8a9b-0c1d2e3f4a5b

  /upload-files:
    get:
      summary: List upload files for a version
