  /versions/{name}/assemblies/{id}:
    get:
      summary: Get Assembly Version detail
      operationId: getAssemblyVersionDetail
      tags: [Assembly Versions]
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
          description: Database Version name (e.g. `dmel_r6.59`).
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Assembly Version id (the `id` field from `GET /versions/{name}/assemblies`). Not the species code, since one Database Version can hold several assemblies of the same species. An id from another Database Version returns 404.
      responses:
        '200':
          description: Full detail for the requested assembly.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/AssemblyVersionDetail'
                  requestId:
                    type: string
        '403':
          description: Missing or invalid token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                forbidden:
                  value:
                    error: permission denied
                    requestId: 7f3e2a1b-4c5d-6e7f-8a9b-0c1d2e3f4a5b
        '404':
          description: Version or assembly version not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                versionNotFound:
                  value:
                    error: version not found
                    requestId: 7f3e2a1b-4c5d-6e7f-8a9b-0c1d2e3f4a5b
                assemblyNotFound:
                  value:
                    error: assembly version not found
                    requestId: 7f3e2a1b-4c5d-6e7f-8a9b-0c1d2e3f4a5b

    delete:
      summary: Delete an Assembly Version (species)
      operationId: deleteAssemblyVersion
      tags: [Assembly Versions]
      description: |
        Permanently deletes one species from a Database Version and all of its own
        data: upload file records are hard-deleted from the database and their files
        are removed from disk, and all jobs for this assembly are deleted. There is no
        orthology-related guard — this never touches the Database Version's shared
        `orthology.tsv` data, since orthology belongs to no single assembly.

        Also removes that species' Elasticsearch indices (genomic, sequence, synonym,
        dsrna — never orthology) and its JBrowse2 assembly and tracks. These two cleanups
        are best-effort: a failure is logged but does not fail the request.

        **Preconditions** (returns 422 if not met):
        - The assembly must have no active (PENDING or RUNNING) jobs.
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
          description: Database Version name (e.g. `dmel_r6.59`).
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Assembly Version id (the `id` field from `GET /versions/{name}/assemblies`). An id from another Database Version returns 404.
      responses:
        '204':
          description: Assembly version and all related data deleted successfully.
        '403':
          description: Missing or invalid token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                forbidden:
                  value:
                    error: permission denied
                    requestId: 7f3e2a1b-4c5d-6e7f-8a9b-0c1d2e3f4a5b
        '404':
          description: Version or assembly version not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                versionNotFound:
                  value:
                    error: version not found
                    requestId: 7f3e2a1b-4c5d-6e7f-8a9b-0c1d2e3f4a5b
                assemblyNotFound:
                  value:
                    error: assembly version not found
                    requestId: 7f3e2a1b-4c5d-6e7f-8a9b-0c1d2e3f4a5b
        '422':
          description: Precondition not met.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                hasActiveJobs:
                  summary: Assembly version has active jobs
                  value:
                    error: assembly version has active jobs
                    requestId: 7f3e2a1b-4c5d-6e7f-8a9b-0c1d2e3f4a5b

