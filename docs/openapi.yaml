          description: Assembly version created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/AssemblyVersion'
                  requestId:
                    type: string
        '400':
          description: Missing name or species.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Missing or invalid token.
          content:
