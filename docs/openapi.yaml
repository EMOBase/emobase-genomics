                    requestId: 7f3e2a1b-4c5d-6e7f-8a9b-0c1d2e3f4a5b
                requiredFileNotUploaded:
                  summary: A required file has not been uploaded yet for some assembly
                  value:
                    error: "required file not uploaded: genomic.fna (species Hsap)"
                    requestId: 7f3e2a1b-4c5d-6e7f-8a9b-0c1d2e3f4a5b
                fileJobsNotComplete:
                  summary: Jobs for the latest uploaded file of some type are not all done
