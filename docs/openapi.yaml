  /versions/{name}:
    delete:
      summary: Delete a version
      operationId: deleteVersion
      tags: [Versions]
      description: |
        Permanently deletes a version and all of its associated data:
        - Upload file records are hard-deleted from the database and their files are removed from disk.
        - All jobs for the version are deleted.
        - All Elasticsearch indexes for the version are deleted (`genomiclocation`, `sequence`, `orthology`, `synonym`).

        **Preconditions** (returns 422 if not met):
        - The version must not be the current default version.
        - The version must have no active (PENDING or RUNNING) jobs.
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
          description: Version name (e.g. `dmel_r6.54`).
      responses:
        '204':
          description: Version and all related data deleted successfully.
        '403':
          description: Missing or invalid token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                forbidden:
                  value:
                    error: permission denied
                    requestId: 7f3e2a1b-4c5d-6e7f-8a9b-0c1d2e3f4a5b
        '404':
          description: Version not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                notFound:
                  value:
                    error: version not found
                    requestId: 7f3e2a1b-4c5d-6e7f-8a9b-0c1d2e3f4a5b
        '422':
          description: Precondition not met.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                isDefault:
                  summary: Version is the current default
                  value:
                    error: cannot delete the default version
                    requestId: 7f3e2a1b-4c5d-6e7f-8a9b-0c1d2e3f4a5b
                hasActiveJobs:
                  summary: Version has active jobs
                  value:
                    error: version has active jobs
                    requestId: 7f3e2a1b-4c5d-6e7f-8a9b-0c1d2e3f4a5b

  /versions/{name}/release:
    post:
      summary: Release a version
      operationId: releaseVersion
      tags: [Versions]
      description: |
        For every Assembly Version (species) in this Database Version, enqueues
        `GENOMIC.FNA:SETUP_BLAST`, `PROTEIN.FAA:SETUP_BLAST`, and `RNA.FNA:SETUP_BLAST` jobs
        for that assembly's latest completed file of each type. For `protein.faa` and
        `rna.fna`, if an assembly has no completed upload of that type, a
        `PROTEIN.FAA:REMOVE_BLAST` / `RNA.FNA:REMOVE_BLAST` job is enqueued instead, so a
        BLAST database built by a previous release isn't left stale and served under this
        version. Once every enqueued blast job across every assembly succeeds, the version
        is automatically promoted to the default, the BLAST container is restarted, and
        every assembly's JBrowse2 view is promoted to the front of the default session
        (older versions' assemblies remain available but no longer take priority).

        Blast jobs are re-enqueued on every release call, even if this version was already
        fully released before — releasing this version again (e.g. to switch the active
        default back to it after a different version was released) always rebuilds its
        BLAST databases from this version's own files. Only a job that's still in-flight
        (`PENDING`/`RUNNING`) for a given assembly is skipped, to avoid enqueuing a
        duplicate from a repeated request.

        BLAST databases are built per assembly (one set per species), so every assembly in
        the default version is searchable at once. When a different version was previously
        the default, its now-superseded BLAST databases are removed on promotion.

        **Preconditions** (returns 422 if not met):
        - This Database Version must have at least one Assembly Version.
        - Every Assembly Version's `genomic.fna` must have at least one completed upload.
        - All jobs generated from the latest completed file of every uploaded type, for
          every assembly and for the shared `orthology.tsv` (if any), must be in `DONE` state.

        If a non-failed blast job already exists for a given assembly/type it is skipped (idempotent per assembly and type).
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
          description: Version name (e.g. `dmel_r6.54`).
      responses:
        '200':
          description: Blast jobs enqueued. Returns the version and the newly created jobs.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    allOf:
                      - $ref: '#/components/schemas/Version'
                      - type: object
                        required: [jobs]
                        properties:
                          jobs:
                            type: array
                            description: Blast jobs created by this release call. Empty if all blast jobs already existed.
                            items:
                              $ref: '#/components/schemas/JobSummary'
                  requestId:
                    type: string
        '403':
          description: Missing or invalid token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                forbidden:
                  value:
                    error: permission denied
                    requestId: 7f3e2a1b-4c5d-6e7f-8a9b-0c1d2e3f4a5b
        '404':
          description: Version not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                notFound:
                  value:
                    error: version not found
                    requestId: 7f3e2a1b-4c5d-6e7f-8a9b-0c1d2e3f4a5b
        '422':
          description: Precondition not met.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
