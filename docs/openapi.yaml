      responses:
        '200':
          description: List of versions.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/VersionPublicItem'
                  requestId:
                    type: string

  /versions:
    get:
      summary: List versions
