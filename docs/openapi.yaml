                  requestId:
                    type: string
        '400':
          description: Missing `version` query parameter.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                missingVersion:
                  value:
                    error: version query parameter is required
                    requestId: 7f3e2a1b-4c5d-6e7f-8a9b-0c1d2e3f4a5b
        '403':
          description: Missing or invalid token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                forbidden:
                  value:
                    error: permission denied
                    requestId: 7f3e2a1b-4c5d-6e7f-8a9b-0c1d2e3f4a5b
        '404':
          description: Version not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                notFound:
                  value:
                    error: version not found
                    requestId: 7f3e2a1b-4c5d-6e7f-8a9b-0c1d2e3f4a5b

  /upload-files/templates/{fileType}:
    get:
      summary: Download a bundle manifest template
      description: |
        Returns a header-only `manifest.csv` for a bundle upload. Fill in one row per data file in the archive.

        | Bundle `fileType` | Columns |
        |---|---|
        | `orthology.bundle` | `fileName`, `order` (integer), `algorithm` |
        | `jbrowse.track.bundle` | `fileName`, `trackName`, `category` (optional), `selectInDefaultSession` (optional, `true`/`false`) |

        `fileName` is the data file's name inside the archive. The other columns have the same meaning as the matching upload metadata fields (see `POST /uploads`).
      operationId: getManifestTemplate
      tags: [Uploads]
      parameters:
        - name: fileType
          in: path
          required: true
          schema:
            type: string
            enum: [orthology.bundle, jbrowse.track.bundle]
      responses:
        '200':
          description: Header-only CSV, sent as an attachment named `{fileType}.manifest.csv`.
          content:
            text/csv:
              schema:
                type: string
              example: |
                fileName,order,algorithm
        '400':
          description: Unknown bundle file type.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                unknownType:
                  value:
                    error: unknown bundle fileType "genomic.gff"
                    requestId: 7f3e2a1b-4c5d-6e7f-8a9b-0c1d2e3f4a5b
        '403':
          description: Missing or invalid token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                forbidden:
                  value:
                    error: permission denied
                    requestId: 7f3e2a1b-4c5d-6e7f-8a9b-0c1d2e3f4a5b

  /upload-files/{id}:
    delete:
      summary: Delete an upload file
      description: |
        Enqueues an async delete job for the uploaded file. Only files of type `orthology.tsv`
        and `jbrowse.track` may be deleted. The appropriate job type is selected automatically:
        - `orthology.tsv` → enqueues `ORTHOLOGY.TSV:DELETE`
        - `jbrowse.track` → enqueues `JBROWSE.TRACK:DELETE` (runs `jbrowse remove-track`, then soft-deletes the record and removes the file from disk)

        The deletion is processed asynchronously by the worker.
      operationId: deleteUploadFile
      tags: [Uploads]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Upload file ID (UUID).
      responses:
        '200':
          description: Delete job enqueued successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/JobSummary'
                  requestId:
                    type: string
                    example: 7f3e2a1b-4c5d-6e7f-8a9b-0c1d2e3f4a5b
        '403':
          description: Missing or invalid token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                forbidden:
                  value:
                    error: permission denied
                    requestId: 7f3e2a1b-4c5d-6e7f-8a9b-0c1d2e3f4a5b
        '404':
          description: Upload file not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                notFound:
                  value:
                    error: upload file not found
                    requestId: 7f3e2a1b-4c5d-6e7f-8a9b-0c1d2e3f4a5b
        '409':
          description: A delete job for this file is already pending or running.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                deletePending:
                  value:
                    error: a delete job for this file is already pending or running
                    requestId: 7f3e2a1b-4c5d-6e7f-8a9b-0c1d2e3f4a5b
        '422':
          description: File type cannot be deleted (only `orthology.tsv` and `jbrowse.track` files are deletable).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                notDeletable:
                  value:
                    error: this file type cannot be deleted
                    requestId: 7f3e2a1b-4c5d-6e7f-8a9b-0c1d2e3f4a5b

tags:
  - name: Search
    description: Gene search, autocomplete, silencing sequences across synonym, orthology, and dsRNA indexes.
  - name: Genes
    description: Gene detail lookup — genomic location, sequences, and synonyms.
  - name: Orthology
    description: Direct orthology lookup by known gene IDs.
  - name: Versions
    description: Genome version management.
  - name: Assembly Versions
    description: Per-species assembly management within a Database Version.
  - name: Jobs
    description: Background processing job tracking.
  - name: Uploads
    description: Resumable file uploads (TUS protocol v1.0.0).
  - name: System
    description: Infrastructure endpoints.
